<?xml version="1.0" encoding="UTF-8"?>
<svg width="792" height="451" viewBox="0 0 792 451" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Diagonal strokes: same spacing + subtle contrast as Part 2/3 -->
    <pattern id="diagStripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18"
            stroke="#E7ECF3" stroke-width="1" opacity="1"
            vector-effect="non-scaling-stroke"/>
    </pattern>

    <clipPath id="clip">
      <rect width="792" height="451" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="792" height="451" fill="#ECF0F5"/>
    <rect width="792" height="451" fill="url(#diagStripes)"/>
  </g>

  <rect x="0.5" y="0.5" width="791" height="450" rx="15.5" stroke="#E2E8F0"/>

  <text x="396" y="230" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="32" font-weight="700" fill="#0F172A">
    Coming soon
  </text>

  <text x="396" y="259" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="14" font-weight="400" fill="#64748B">
    Part 3/3 content in progress
  </text>
</svg>
